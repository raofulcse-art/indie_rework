name: Bug
description: Report behaviour that differs from an accepted rule or expectation.
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Reference the applicable business-rule ID when available.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
